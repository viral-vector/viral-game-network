version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    env_file:
      - .env
    container_name: app
    depends_on:
      - cache
      - store
    environment:
      - APP_KEY=${APP_KEY}
      - APP_ENV=${APP_ENV}
      - CACHE_ENDPOINT=${CACHE_ENDPOINT}
      - CACHE_USERNAME=${CACHE_USERNAME}
      - CACHE_PASSWORD=${CACHE_PASSWORD}
      - STORE_ENDPOINT=${STORE_ENDPOINT}
      - STORE_USERNAME=${STORE_USERNAME}
      - STORE_PASSWORD=${STORE_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - viral-game-network
  cache:
    image: redis:6.2-alpine
    env_file:
      - .env
    environment:
      - CACHE_USERNAME=${CACHE_USERNAME}
      - CACHE_PASSWORD=${CACHE_PASSWORD}
    container_name: cache-redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes: 
      - viral-game-network-cache:/data
    networks:
      - viral-game-network
  store:
    image: surrealdb/surrealdb:latest
    env_file:
      - .env
    environment:
      - STORE_PASSWORD=${STORE_USERNAME}
      - STORE_PASSWORD=${STORE_PASSWORD}
    container_name: store-surrealdb
    restart: always
    command: start --user=${STORE_USERNAME} --pass=${STORE_PASSWORD}
    ports:
      - 8000:8000
    volumes:
      - viral-game-network-store:/data
    networks:
      - viral-game-network
volumes:
  viral-game-network-cache:
    driver: local
  viral-game-network-store:
    driver: local
networks:
  viral-game-network:
    driver: bridge